## Kubernetes Advanced labs v1.5.0
apiVersion: v1
kind: Pod
metadata:
  name: container-security-context-example
spec:
  securityContext:
    runAsUser: 1000
  containers:
  - name: container-security-context-example
    image: gcr.io/google-samples/node-hello:1.0
    securityContext:
      runAsUser: 2000
      allowPrivilegeEscalation: false
